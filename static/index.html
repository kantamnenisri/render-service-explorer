<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Render Service Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-12 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400">
                    Render Service Explorer
                </h1>
                <p class="text-gray-400 mt-2">Centralized dashboard for all your Render services</p>
            </div>
            <button onclick="fetchServices()" class="p-2 px-4 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm border border-gray-700">
                <i class="fas fa-sync-alt mr-2"></i> Refresh
            </button>
        </header>

        <!-- Filters -->
        <div class="flex flex-wrap gap-4 mb-8">
            <button onclick="filterServices('all')" class="px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 transition-colors border border-gray-700 focus:ring-2 focus:ring-blue-500">All</button>
            <button onclick="filterServices('web_service')" class="px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 transition-colors border border-gray-700 focus:ring-2 focus:ring-blue-500">Web Services</button>
            <button onclick="filterServices('static_site')" class="px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 transition-colors border border-gray-700 focus:ring-2 focus:ring-blue-500">Static Sites</button>
            <button onclick="filterServices('cron_job')" class="px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 transition-colors border border-gray-700 focus:ring-2 focus:ring-blue-500">Cron Jobs</button>
            <button onclick="filterServices('private_service')" class="px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 transition-colors border border-gray-700 focus:ring-2 focus:ring-blue-500">Private Services</button>
        </div>

        <!-- Grid -->
        <div id="services-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Loading skeleton -->
            <div class="animate-pulse bg-gray-800 p-6 rounded-xl h-48 border border-gray-700"></div>
            <div class="animate-pulse bg-gray-800 p-6 rounded-xl h-48 border border-gray-700"></div>
            <div class="animate-pulse bg-gray-800 p-6 rounded-xl h-48 border border-gray-700"></div>
        </div>
    </div>

    <script>
        let allServices = [];

        async function fetchServices() {
            const grid = document.getElementById('services-grid');
            grid.innerHTML = '<div class="col-span-full text-center py-12"><i class="fas fa-spinner fa-spin text-4xl text-indigo-500"></i><p class="mt-4 text-gray-500">Fetching services from Render...</p></div>';
            
            try {
                const res = await fetch('/api/services');
                const data = await res.json();
                
                if (res.status !== 200) {
                    throw new Error(data.error || `HTTP ${res.status}`);
                }
                
                allServices = data;
                renderServices(allServices);
            } catch (err) {
                console.error("Fetch Error:", err);
                grid.innerHTML = `
                    <div class="col-span-full bg-red-900/20 text-red-400 p-8 rounded-xl border border-red-800 shadow-2xl">
                        <div class="flex items-start">
                            <i class="fas fa-exclamation-triangle text-2xl mr-4 mt-1"></i>
                            <div>
                                <h3 class="text-xl font-bold mb-2">Failed to Load Services</h3>
                                <p class="text-sm opacity-80 mb-4">${err.message}</p>
                                <div class="bg-black/30 p-4 rounded text-xs font-mono mb-4">
                                    Checklist:<br>
                                    1. Is RENDER_API_KEY correct in your .env file?<br>
                                    2. Did you restart the server after updating .env?<br>
                                    3. Is your machine connected to the internet?
                                </div>
                                <button onclick="fetchServices()" class="px-4 py-2 bg-red-800 hover:bg-red-700 text-white rounded font-bold transition-colors">
                                    Try Again
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function getIcon(type) {
            switch(type) {
                case 'web_service': return 'fa-server';
                case 'static_site': return 'fa-globe';
                case 'cron_job': return 'fa-clock';
                case 'private_service': return 'fa-lock';
                case 'background_worker': return 'fa-cog';
                default: return 'fa-box';
            }
        }

        function getStatusColor(status) {
            if (!status) return 'text-gray-400 bg-gray-400/10 border-gray-400/30';
            switch(status.toLowerCase()) {
                case 'live': return 'text-green-400 bg-green-400/10 border-green-400/30';
                case 'suspended': return 'text-red-400 bg-red-400/10 border-red-400/30';
                case 'not_deployed': return 'text-yellow-400 bg-yellow-400/10 border-yellow-400/30';
                case 'deployment_in_progress': return 'text-blue-400 bg-blue-400/10 border-blue-400/30';
                default: return 'text-blue-400 bg-blue-400/10 border-blue-400/30';
            }
        }

        function renderServices(services) {
            const grid = document.getElementById('services-grid');
            if (!services || services.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-20 bg-gray-800/50 rounded-xl border border-gray-700"><p class="text-gray-500 italic">No services found in this account.</p></div>';
                return;
            }

            grid.innerHTML = services.map(s => `
                <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-xl hover:border-indigo-500/50 transition-all group">
                    <div class="flex justify-between items-start mb-4">
                        <div class="p-3 rounded-lg bg-gray-900 text-indigo-400 group-hover:bg-indigo-500 group-hover:text-white transition-colors">
                            <i class="fas ${getIcon(s.type)}"></i>
                        </div>
                        <span class="px-3 py-1 text-xs font-bold rounded-full border ${getStatusColor(s.status)}">
                            ${(s.status || 'unknown').toUpperCase().replace(/_/g, ' ')}
                        </span>
                    </div>
                    
                    <h2 class="text-xl font-bold mb-1 truncate">${s.name}</h2>
                    <p class="text-xs text-gray-500 font-mono uppercase tracking-tighter mb-4">${s.type.replace(/_/g, ' ')}</p>
                    
                    <div class="space-y-3 mb-6">
                        ${s.url ? `
                            <a href="${s.url}" target="_blank" class="flex items-center text-sm text-blue-400 hover:underline">
                                <i class="fas fa-external-link-alt mr-2 text-gray-400"></i> ${s.url.replace('https://', '')}
                            </a>
                        ` : '<span class="flex items-center text-sm text-gray-600"><i class="fas fa-link-slash mr-2"></i> No Public URL</span>'}
                        ${s.repo ? `
                            <a href="${s.repo}" target="_blank" class="flex items-center text-sm text-gray-400 hover:text-white">
                                <i class="fab fa-github mr-2"></i> Repository
                            </a>
                        ` : ''}
                    </div>

                    <div class="pt-4 border-t border-gray-700 flex justify-between items-center text-xs text-gray-500">
                        <span>Updated ${new Date(s.updated_at).toLocaleDateString()}</span>
                        <a href="https://dashboard.render.com/services/${s.id}" target="_blank" class="text-indigo-400 hover:text-indigo-300 font-bold uppercase tracking-widest text-[10px]">
                            Dashboard <i class="fas fa-arrow-right ml-1"></i>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function filterServices(type) {
            if (type === 'all') {
                renderServices(allServices);
            } else {
                renderServices(allServices.filter(s => s.type === type));
            }
        }

        fetchServices();
    </script>
</body>
</html>
